ShortDescription: A modern terminal emulator with multi-pane tiling, command history, and session persistence.
Description: |-
  YOLOTerm is a modern terminal emulator for Windows featuring:
  - Multi-pane tiling with flexible layouts
  - Full truecolor (24-bit) support
  - Session persistence and workspace restoration
  - Command history with full-text search
  - Shell integration (PowerShell, Git Bash)
  - Theme support (Windows Terminal, iTerm2, Ghostty)
  - Windows 11-style native tabs
