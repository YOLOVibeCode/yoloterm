name: Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'windows/YOLOTerm.App/YOLOTerm.App.csproj'
  SOLUTION_PATH: 'windows/YOLOTerm.sln'

jobs:
  build-and-release:
    strategy:
      matrix:
        arch: [x64, arm64]
    
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          cd windows
          dotnet restore ${{ env.SOLUTION_PATH }}
      
      - name: Build solution (Release, ${{ matrix.arch }})
        run: |
          cd windows
          dotnet build ${{ env.SOLUTION_PATH }} -c Release -r win-${{ matrix.arch }} --self-contained false --no-restore
      
      - name: Run tests
        run: |
          cd windows
          dotnet test YOLOTerm.Tests/YOLOTerm.Tests.csproj -c Release --no-build --verbosity normal
      
      - name: Run benchmarks
        run: |
          cd windows
          pwsh ../scripts/benchmark-windows.ps1
      
      - name: Publish app (Release, ${{ matrix.arch }})
        run: |
          cd windows
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-${{ matrix.arch }} --self-contained false -o publish-${{ matrix.arch }}/
      
      - name: Sign executable with Authenticode
        if: github.event_name == 'release' && secrets.WINDOWS_CERTIFICATE != ''
        run: |
          # Decode certificate from base64
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $certPath = "windows/cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          
          # Sign the executable
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
            /f $certPath `
            /p "${{ secrets.CERTIFICATE_PASSWORD }}" `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /fd sha256 `
            windows/publish-${{ matrix.arch }}/YOLOTerm.exe
          
          # Clean up certificate
          Remove-Item $certPath
      
      - name: Create MSIX package
        if: github.event_name == 'release'
        run: |
          # Copy manifest to publish directory
          Copy-Item windows/Package.appxmanifest windows/publish-${{ matrix.arch }}/
          
          # Create MSIX package using MakeAppx
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe" pack `
            /d windows/publish-${{ matrix.arch }} `
            /p windows/YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}.msix
      
      - name: Sign MSIX package
        if: github.event_name == 'release' && secrets.WINDOWS_CERTIFICATE != ''
        run: |
          # Decode certificate from base64
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $certPath = "windows/cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          
          # Sign the MSIX
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
            /f $certPath `
            /p "${{ secrets.CERTIFICATE_PASSWORD }}" `
            /fd SHA256 `
            windows/YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}.msix
          
          # Clean up certificate
          Remove-Item $certPath
      
      - name: Create portable ZIP
        run: |
          cd windows/publish-${{ matrix.arch }}
          Compress-Archive -Path * -DestinationPath ../YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}-portable.zip
      
      - name: Generate SHA256 checksums
        run: |
          cd windows
          
          # MSIX checksum
          if (Test-Path "YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}.msix") {
            $msixHash = (Get-FileHash "YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}.msix" -Algorithm SHA256).Hash
            "$msixHash  YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}.msix" | Out-File -Append checksums-${{ matrix.arch }}.txt
          }
          
          # ZIP checksum
          $zipHash = (Get-FileHash "YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}-portable.zip" -Algorithm SHA256).Hash
          "$zipHash  YOLOTerm-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.arch }}-portable.zip" | Out-File -Append checksums-${{ matrix.arch }}.txt
      
      - name: Upload artifacts to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows/YOLOTerm-${{ github.event.release.tag_name }}-${{ matrix.arch }}.msix
            windows/YOLOTerm-${{ github.event.release.tag_name }}-${{ matrix.arch }}-portable.zip
            windows/checksums-${{ matrix.arch }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload build artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ matrix.arch }}
          path: |
            windows/YOLOTerm-*.msix
            windows/YOLOTerm-*-portable.zip
            windows/checksums-${{ matrix.arch }}.txt
            windows/benchmarks-*.txt
  
  update-winget:
    if: github.event_name == 'release'
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Generate winget manifest
        run: |
          echo "📦 Winget submission instructions:"
          echo "1. Fork https://github.com/microsoft/winget-pkgs"
          echo "2. Create manifests/y/YOLOVibeCode/YOLOTerm/${{ github.event.release.tag_name }}/"
          echo "3. Copy windows/winget-manifest.yaml and update SHA256 hashes"
          echo "4. Create PR to microsoft/winget-pkgs"
          echo ""
          echo "See RELEASE_WINDOWS.md for detailed instructions."
